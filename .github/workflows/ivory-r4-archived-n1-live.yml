name: Ivory R4 archived N1 EXACT local model proof (research-only)
on:
  push:
    branches:
      - experiment/jev-r2-r3-semantic-seam
    paths:
      - experiments/jev-seam/r4-archived-n1-live.mjs
      - .github/workflows/ivory-r4-archived-n1-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-complete-local:
    name: Actual archived N1 new EXACT fixture, real MiniLM, experimental journal/restart
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: mberrys/ivory-archive
          ref: bfcb283c4fe32b64b67a325f8f55aca08314296f
          path: .audit/archive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile pinned archive identity and exact N1 reference kernel
        working-directory: .audit/archive
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node node_modules/typescript/bin/tsc --project packages/ivory-identity/tsconfig.json
          node node_modules/typescript/bin/tsc --project packages/ivory-tower-research-kernel/tsconfig.json
      - name: Install local CPU inference for real model
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'huggingface_hub>=0.30,<1'
      - name: Verify original N1 BLOCKED and new archived N1 EXACT with real local MiniLM/restart
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          node experiments/jev-seam/r4-archived-n1-live.mjs | tee r4-archive-raw.log
          sed -n 's/^IVORY_R4_REAL_ARCHIVE_N1=//p' r4-archive-raw.log > r4-archive-proof.json
          python -m json.tool r4-archive-proof.json >/dev/null
          python -c "import json; x=json.load(open('r4-archive-proof.json')); assert x['original_gold_citation']['status']=='BLOCKED' and not x['original_gold_citation']['model_dispatched']; assert x['distinct_new_synthetic_citation']['status']=='EXACT'; assert x['model_calls']==1 and x['archive_snapshot_unchanged'] and x['model_to_canonical_writes']==0 and x['persisted_experimental_journal_reopened']; assert x['model_metrics']['input_tokens']<=384; print('archived N1 genuine mechanical context and local-model isolation verified')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivory-r4-actual-archived-n1-exact-local-model
          path: |
            r4-archive-proof.json
            r4-archive-raw.log
          if-no-files-found: warn
