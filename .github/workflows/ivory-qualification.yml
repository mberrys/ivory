name: Ivory qualification

on:
  push:
    paths:
      - 'packages/ivory-core/**'
      - 'packages/ivory-qualification/**'
      - '.github/workflows/ivory-qualification.yml'
  pull_request:
    paths:
      - 'packages/ivory-core/**'
      - 'packages/ivory-qualification/**'
      - '.github/workflows/ivory-qualification.yml'

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x

      # The packages have no native or downloaded dependencies, so install scripts are not needed.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Build lint rules
        run: npm run build:tools

      # Lerna runs the targets of one invocation in parallel, and the tests load `lib/`.
      - name: Compile
        run: npx lerna run compile --scope @ivory/qualification --include-dependencies

      - name: Lint and test
        run: npx lerna run lint,test --scope @ivory/qualification

  linux-evidence:
    name: Linux evidence
    needs: smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x

      - name: Install
        run: npm ci --ignore-scripts

      - name: Build lint rules
        run: npm run build:tools

      - name: Compile
        id: compile
        run: npx lerna run compile --scope @ivory/qualification --include-dependencies

      # Each run exits 1 when a gated criterion fails, and the steps after it still run, so that the artifact holds every record.
      - name: Kill harness, synchronous=FULL
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: packages/ivory-qualification
        run: >
          node lib/node/qualify.js kill --cycles 100
          --points duringBlobStage,beforeBlobInstall,afterBlobInstall,beforeDbCommit,afterDbCommit,random
          --synchronous FULL --out "${{ runner.temp }}/iv5-6-evidence"

      - name: Kill harness, synchronous=OFF control
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: packages/ivory-qualification
        run: >
          node lib/node/qualify.js kill --cycles 100
          --points duringBlobStage,beforeBlobInstall,afterBlobInstall,beforeDbCommit,afterDbCommit,random
          --synchronous OFF --out "${{ runner.temp }}/iv5-6-evidence"

      - name: Latency
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: packages/ivory-qualification
        run: node lib/node/qualify.js latency --duration 120 --out "${{ runner.temp }}/iv5-6-evidence"

      - name: Upload evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: iv5-6-linux-evidence
          path: ${{ runner.temp }}/iv5-6-evidence
          retention-days: 90
          if-no-files-found: error
