name: Ivory V5 reset evidence (experimental)
on:
  push:
    branches:
      - integration/ivory-v5-reset-archive
      - experiment/jev-r2-r3-semantic-seam
  workflow_dispatch:
permissions:
  contents: read
jobs:
  archive-and-boundaries:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact archived development head
        uses: actions/checkout@v4
        with:
          repository: mberrys/ivory-archive
          ref: bfcb283c4fe32b64b67a325f8f55aca08314296f
          path: .audit/archive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify pinned archive source identities
        run: node scripts/ivory/v5-verify-source.mjs .audit/archive
      - name: Exercise isolated experimental decision boundary
        run: node --test experiments/jev-seam/*.spec.mjs

  clean-theia-baseline:
    name: Clean upstream Theia baseline install and build
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout the exact clean reset baseline (not archived development)
        uses: actions/checkout@v4
        with:
          ref: b0f9e63a6d331135265869a341dce7c7f1eef158
          path: .audit/theia-baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Record environment and install native dependencies
        run: |
          node --version
          npm --version
          uname -a
          git -C .audit/theia-baseline rev-parse HEAD
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install and build clean baseline
        working-directory: .audit/theia-baseline
        env:
          NODE_OPTIONS: --max_old_space_size=4096
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
          sha256sum package-lock.json
          git rev-parse HEAD

  archived-n1-bridge:
    name: Archived N1 golden trace to isolated Jev seam
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Checkout experiment only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned N1 archive
        uses: actions/checkout@v4
        with:
          repository: mberrys/ivory-archive
          ref: bfcb283c4fe32b64b67a325f8f55aca08314296f
          path: .audit/archive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install archival compile dependencies without build hooks
        working-directory: .audit/archive
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile isolated archived identity and N1 reference kernel
        working-directory: .audit/archive
        run: |
          node node_modules/typescript/bin/tsc --project packages/ivory-identity/tsconfig.json
          node node_modules/typescript/bin/tsc --project packages/ivory-tower-research-kernel/tsconfig.json
      - name: Run real archived N1-to-Jev-seam composition test
        run: node --test experiments/jev-seam/*.bridge.mjs
