name: Ivory R4 isolated real local model + durable review proof
on:
  push:
    branches:
      - experiment/jev-r2-r3-semantic-seam
    paths:
      - experiments/jev-seam/r4-local-nli-adapter.py
      - experiments/jev-seam/r4-live-model-proof.mjs
      - experiments/jev-seam/r4-review-receipts.mjs
      - experiments/jev-seam/r4-review-receipts.spec.mjs
      - .github/workflows/ivory-r4-local-review-proof.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-public-synthetic:
    name: Local MiniLM on complete synthetic basis -> isolated proposal receipt -> restart
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU-only local open model dependencies
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'huggingface_hub>=0.30,<1'
      - name: Run exact local-model process on synthetic complete basis, assert fail-closed and replay
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          node experiments/jev-seam/r4-live-model-proof.mjs | tee r4-live-raw.log
          sed -n 's/^IVORY_R4_LOCAL_PROOF=//p' r4-live-raw.log > r4-local-proof.json
          python -m json.tool r4-local-proof.json >/dev/null
          python -c "import json; x=json.load(open('r4-local-proof.json')); assert x['model_inference_calls']==1 and x['mandatory_incomplete_basis_pre_dispatch'] and x['persistent_replay_equal'] and x['client_read_parity']; assert x['model_metrics']['input_tokens']<=384; assert x['canonical_research_writes']==0 and x['human_decisions']==0; print('real-local-model and narrow authority proof: passed')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivory-r4-real-local-synthetic-receipt
          path: |
            r4-local-proof.json
            r4-live-raw.log
          if-no-files-found: warn
