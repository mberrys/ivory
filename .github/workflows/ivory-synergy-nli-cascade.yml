name: Ivory SYNERGY real-screening NLI cascade (experimental)
on:
  push:
    branches:
      - experiment/jev-r2-r3-semantic-seam
    paths:
      - experiments/jev-seam/synergy-screening-nli.py
      - .github/workflows/ivory-synergy-nli-cascade.yml
  workflow_dispatch:
permissions:
  contents: read

jobs:
  synergy-real-review:
    name: Public SYNERGY historical abstract labels / local MiniLM NLI / rules cascade
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local CPU evaluator and source client
        run: |
          python -m pip install --disable-pip-version-check torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check 'transformers>=4.45,<5' 'huggingface_hub>=0.30,<1' sentencepiece
      - name: Execute real historical review labels and preserve negative evidence
        env:
          HF_HUB_DISABLE_TELEMETRY: '1'
          TOKENIZERS_PARALLELISM: 'false'
        run: |
          set -o pipefail
          python experiments/jev-seam/synergy-screening-nli.py | tee synergy-inference.log
          sed -n 's/^IVORY_SYNERGY_SCREEN_RESULT=//p' synergy-inference.log > synergy-nli-evidence.json
          python -m json.tool synergy-nli-evidence.json >/dev/null
          python -c "import json; x=json.load(open('synergy-nli-evidence.json')); assert x['sample']['n']==96 and len(x['records'])==96; assert x['source']['deduplicated_screen_positive']>=24 and x['source']['deduplicated_screen_negative']>=72; assert x['configuration']['no_auto_exclusion']; assert all('title' not in r and 'abstract' not in r for r in x['records']); print('frozen sample and safety artifact checks passed')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ivory-synergy-real-labels-nli-cascade
          path: |
            synergy-nli-evidence.json
            synergy-inference.log
          if-no-files-found: warn
